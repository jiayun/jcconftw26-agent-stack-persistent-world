name: 驗證遊戲與協定
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: frontend
      - run: ./gradlew test :server:bootJar
      - name: 四條真實 HTTP 路線
        run: |
          java -jar server/build/libs/server-0.1.0.jar > /tmp/world-smoke.log 2>&1 &
          game_pid=$!
          trap 'kill "$game_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/settings > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 測試報告
          path: '**/build/reports/tests/'
